name: AztraAI Knowledge Updater

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Python deps
        run: pip install requests

      - name: Update knowledge
        run: |
          mkdir -p data

          python3 <<EOF
import json, requests, random, re

# Load existing knowledge
try:
    with open("data/knowledge.json") as f:
        data = json.load(f)
except:
    data = {"topics": []}

# Rotating topics (you can add more)queries = [
    # Programming basics
    "what is programming",
    "how to code",
    "beginner coding tutorial",
    "what is a variable",
    "what are functions in programming",
    "loops in programming explained",

    # JavaScript
    "javascript tutorial",
    "how to use javascript",
    "javascript basics for beginners",
    "what is dom javascript",
    "javascript fetch api",
    "how to make a game in javascript",

    # Python
    "python programming basics",
    "what is python used for",
    "python tutorial beginner",
    "how to build apps with python",

    # Web dev
    "how to build a website",
    "html css javascript guide",
    "what is frontend development",
    "what is backend development",
    "how websites work",
    "responsive web design basics",

    # AI / Tech
    "what is artificial intelligence",
    "how machine learning works",
    "what is neural network",
    "how chatbots work",
    "what is generative ai",
    "how ai models are trained",

    # Game dev
    "how to make a game",
    "game development basics",
    "how to make a 2d game",
    "how to make a 3d game",
    "what is unity engine",
    "what is unreal engine",
    "how physics works in games",

    # Graphics
    "what is webgl",
    "how 3d rendering works",
    "what is ray tracing",
    "how game graphics work",

    # Computer science
    "how computers work",
    "what is cpu",
    "what is gpu",
    "how memory works in computers",
    "what is binary",

    # Internet
    "how the internet works",
    "what is http",
    "what is dns",
    "how browsers work",

    # Security
    "what is cybersecurity",
    "how encryption works",
    "what is hashing",
    "how passwords are stored",

    # Tools
    "what is git",
    "how github works",
    "what is version control",
    "what is api",
    "what is json",

    # App dev
    "how to build an app",
    "how mobile apps work",
    "what is cross platform development",

    # Business / money
    "how to make money online",
    "how startups work",
    "how to build a tech product",

    # Random tech
    "what is cloud computing",
    "what is database",
    "what is server",
    "what is hosting",
    "how software works",

    # Game ideas / fun
    "game design ideas",
    "how to design levels",
    "what makes a game fun",
    "how multiplayer works",

    # Advanced topics
    "what is blockchain",
    "what is virtualization",
    "what is operating system",
    "how linux works",

    # Extra filler to keep it growing
    "coding tips for beginners",
    "best programming practices",
    "how to debug code",
    "how to optimize performance",
    "how algorithms work"
]

query = random.choice(queries)

# Fetch data from DuckDuckGo
url = f"https://api.duckduckgo.com/?q={query}&format=json"
res = requests.get(url).json()

text = (
    res.get("AbstractText")
    or (res.get("RelatedTopics", [{}])[0].get("Text") if res.get("RelatedTopics") else "")
    or query
)

# --- SUMMARIZER ---
def summarize(text):
    text = re.sub(r'\s+', ' ', text).strip()

    sentences = re.split(r'[.!?]', text)
    sentences = [s.strip() for s in sentences if len(s.strip()) > 20]

    if not sentences:
        return f"{query} is an important concept in technology."

    return ". ".join(sentences[:2]) + "."

summary = summarize(text)

# Create entry
new_entry = {
    "keyword": query.split()[0],
    "info": summary
}

# Add to knowledge
data["topics"].append(new_entry)

# Remove duplicates
seen = set()
filtered = []
for item in data["topics"]:
    if item["info"] not in seen:
        filtered.append(item)
        seen.add(item["info"])

# Keep last 120 entries (prevents lag)
data["topics"] = filtered[-120:]

# Save
with open("data/knowledge.json", "w") as f:
    json.dump(data, f, indent=2)

print("Added:", new_entry)
EOF

      - name: Commit changes
        run: |
          git config --global user.name "aztra-bot"
          git config --global user.email "bot@aztra.ai"
          git add data/knowledge.json
          git commit -m "AztraAI auto-learn update" || echo "no changes"
          git push
