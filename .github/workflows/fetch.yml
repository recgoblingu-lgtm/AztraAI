name: AztraAI Knowledge Updater

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Python deps
        run: pip install requests

      - name: Update knowledge
        run: |
          mkdir -p data

          python3 <<EOF
import json, requests, random, re

# Load existing knowledge
try:
    with open("data/knowledge.json") as f:
        data = json.load(f)
except:
    data = {"topics": []}

# Query pool (wide topics)
queries = [
    "programming basics",
    "javascript tutorial",
    "python programming",
    "how to build a website",
    "artificial intelligence",
    "machine learning",
    "game development",
    "web development",
    "computer science",
    "cybersecurity",
    "how computers work",
    "software engineering",
    "how apps work",
    "game design",
    "cloud computing",
    "how internet works",
    "what is API",
    "what is JSON",
    "frontend vs backend",
    "how to debug code",
    "algorithms explained",
    "data structures basics",
    "linux operating system",
    "how databases work",
    "how servers work"
]

def clean_keyword(query):
    words = query.lower().split()
    stopwords = ["what","is","how","to","a","the"]
    words = [w for w in words if w not in stopwords]
    return words[0] if words else query

def summarize(text, query):
    text = re.sub(r'\s+', ' ', text).strip()
    sentences = re.split(r'[.!?]', text)
    sentences = [s.strip() for s in sentences if len(s.strip()) > 25]

    if not sentences:
        return f"{query} is an important concept."

    return ". ".join(sentences[:2]) + "."

# 🔥 Learn MANY things per run
for _ in range(15):  # 15 queries
    query = random.choice(queries)

    try:
        url = f"https://api.duckduckgo.com/?q={query}&format=json"
        res = requests.get(url).json()

        texts = []

        # Main abstract
        if res.get("AbstractText"):
            texts.append(res["AbstractText"])

        # Related topics
        if res.get("RelatedTopics"):
            for t in res["RelatedTopics"][:5]:
                if isinstance(t, dict) and t.get("Text"):
                    texts.append(t["Text"])

        # Summarize each piece
        for text in texts[:7]:  # up to 7 per query
            summary = summarize(text, query)

            new_entry = {
                "keyword": clean_keyword(query),
                "info": summary
            }

            data["topics"].append(new_entry)

    except:
        continue

# Remove duplicates
seen = set()
filtered = []
for item in data["topics"]:
    if item["info"] not in seen:
        filtered.append(item)
        seen.add(item["info"])

# Keep last 300 entries (prevents lag)
data["topics"] = filtered[-300:]

# Save
with open("data/knowledge.json", "w") as f:
    json.dump(data, f, indent=2)

print("Total knowledge:", len(data["topics"]))
EOF

      - name: Commit changes
        run: |
          git config --global user.name "aztra-bot"
          git config --global user.email "bot@aztra.ai"
          git add data/knowledge.json
          git commit -m "AztraAI auto-learn update" || echo "no changes"
          git push
